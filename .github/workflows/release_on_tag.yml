name: "tagged-release"

on:
  push:
    tags:
      - v*

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build project
        run: |
          cd ..
          rm -rf ./page_builder/.github
          rm -rf ./page_builder/.gitignore
          rm -rf ./page_builder/.git
          zip -x ".*" -r page_builder ./page_builder
          tar -czvf page_builder.tar.gz  page_builder
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Directory listing
        run: |
          cd ..
          ls -la
      - name: Upload Release Asset Zip
        id: upload-release-asset
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}
          files: |
            ../page_builder.zip
            ../page_builder.tar.gz